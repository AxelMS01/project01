<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="authService.confirmLogout()" title="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content ion-padding">
  <div class="profile-wrapper">
    <ion-card class="profile-card">
      <div class="avatar-container">
        <div class="avatar-circle">
          <ion-icon name="person"></ion-icon>
        </div>
      </div>
      
      <ion-card-header class="ion-text-center">
        <ion-card-title>{{ user?.name || 'Usuario' }}</ion-card-title>
        <ion-card-subtitle>{{ user?.email || 'Sin correo' }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="inset">
          <ion-item>
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h3>Nombre</h3>
              <p>{{ user?.name || 'No disponible' }}</p>
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h3>Correo Electrónico</h3>
              <p>{{ user?.email || 'No disponible' }}</p>
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="shield-checkmark-outline" slot="start" color="success"></ion-icon>
            <ion-label>
              <h3>Estado de Cuenta</h3>
              <p>Activo</p>
            </ion-label>
          </ion-item>
        </ion-list>

        <!-- Acciones CRUD de Persistencia -->
        <div class="actions-container ion-margin-top">
          <!-- MODIFICACIÓN (UPDATE) -->
          <ion-button expand="block" fill="outline" color="primary" (click)="editProfile()" class="action-btn">
            <ion-icon name="create-outline" slot="start"></ion-icon>
            MODIFICAR INFORMACIÓN
          </ion-button>

          <!-- ELIMINACIÓN DE CACHÉ (DELETE DATA) -->
          <ion-button expand="block" fill="clear" color="medium" (click)="clearOfflineCache()" class="action-btn ion-margin-top">
            <ion-icon name="trash-outline" slot="start"></ion-icon>
            LIMPIAR CACHÉ LOCAL
          </ion-button>
        </div>

        <!-- Botón de Cerrar Sesión (DELETE SESSION) -->
        <div class="logout-btn-container ion-margin-top">
          <ion-button expand="block" color="danger" (click)="authService.confirmLogout()" class="logout-btn">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            CERRAR SESIÓN
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
